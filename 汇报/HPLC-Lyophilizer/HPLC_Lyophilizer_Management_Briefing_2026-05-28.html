function hplcCostLabels(){return I18N[lang].hplcCost;}
function hplcBullets(id){const b=I18N[lang].hplcCost.bullets;return (b&&b[id])?b[id]:[];}
function hplcCostItemHTML(id,amt){
const L=hplcCostLabels();
if(!L[id])return "";
const bullets=hplcBullets(id);
const bl=bullets.length?`<ul class="cost-bullets">${bullets.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const body=bl?`<div class="cost-children">${bl}</div>`:"";
const n=Number(amt)||0;
return `<details class="cost-item cost-item-sub"${bl?"":" data-no-body"}><summary><span class="cost-label">${L[id]}</span><span class="cost-amt">${fm(n)}</span></summary>${body}</details>`;
}
function hplcSectionHd(title,total){
return `<span class="cost-section-title">${title}</span><span class="cost-section-amt">${fm(Number(total)||0)}</span>`;
}
function hplcCostHTML(){
const D=HPLC_COST_DATA,L=hplcCostLabels();
const directSubtotal=Number(D.directSubtotal)||0;
const directCont=Number(D.directCont)||0;
const directTotal=Number(D.directTotal)||0;
const otherSubtotal=Number(D.otherSubtotal)||0;
const otherCont=Number(D.otherCont)||0;
const otherTotal=Number(D.otherTotal)||0;
let directItems=D.directItems.filter(it=>it.amount>0).map(it=>hplcCostItemHTML(it.id,it.amount)).join("");
const directBlock=`<details class="cost-section" open><summary class="cost-section-hd">${hplcSectionHd(L.secDirect,directTotal)}</summary>
<div class="cost-section-body">${directItems}
<div class="cost-subtotal"><span>${L.subtotal}</span><span>${fm(directSubtotal)}</span></div>
<div class="cost-risk-line"><span>${L.directCont}</span><span>${fm(directCont)}</span></div>
<div class="cost-section-total"><span>${L.secTotal}</span><span>${fm(directTotal)}</span></div></div></details>`;
let otherItems=D.otherItems.filter(it=>it.amount>0).map(it=>hplcCostItemHTML(it.id,it.amount)).join("");
const otherBlock=`<details class="cost-section" open><summary class="cost-section-hd">${hplcSectionHd(L.secOther,otherTotal)}</summary>
<div class="cost-section-body">${otherItems}
<div class="cost-subtotal"><span>${L.subtotal}</span><span>${fm(otherSubtotal)}</span></div>
<div class="cost-risk-line"><span>${L.otherCont}</span><span>${fm(otherCont)}</span></div>
<div class="cost-section-total"><span>${L.secTotal}</span><span>${fm(otherTotal)}</span></div></div></details>`;
const genLines=D.genItems.map(it=>`<div class="cost-leaf cost-leaf-sub"><span>${L[it.id]}</span><span>${fm(it.amount)}</span></div>`).join("");
const genBlock=`<details class="cost-section" open><summary class="cost-section-hd">${hplcSectionHd(L.secGen,D.genTotal)}</summary>
<div class="cost-section-body">${genLines}
<div class="cost-section-total"><span>${L.secTotal}</span><span>${fm(D.genTotal)}</span></div></div></details>`;
return `<div class="cost-total-bar"><span>${L.oom}</span><span>${fm(D.oom)}</span></div>${directBlock}${otherBlock}${genBlock}`;
}

function ganttHTML(){
const today=pct("2026-05-28");
let rows="";
GANTT_CALENDAR.forEach((g,i)=>{
const key=g[0];
const left=pct(g[1]),right=pct(g[2]),w=Math.max(1.2,right-left);
const d0=g[1].slice(0,7).replace("-","/"),d1=g[2].slice(0,7).replace("-","/");
const dateLbl=d0+" – "+d1;
const showToday=i===0;
rows+=`<div class="gantt-row"><div class="gantt-label">${t(key)}</div><div class="gantt-track">
${showToday?`<div class="today-line" style="left:${today}%"><span class="today-tag">${t("today")}</span></div>`:""}
<div class="gantt-bar ${g[3]}" style="left:${left}%;width:${w}%" data-en="${g[4].replace(/"/g,"&quot;")}" data-zh="${g[5].replace(/"/g,"&quot;")}" data-dates="${d0} – ${d1}"></div>
</div><div class="gantt-dates">${dateLbl}</div></div>`;
});
const durMax=20;
DURATION_ROWS.forEach(d=>{
const key=d[0],wMin=d[1],wMax=d[2],mid=(wMin+wMax)/2;
const wPct=Math.max(18,(mid/durMax)*88);
const range=lang==="zh"?`${wMin}–${wMax} 周`:`${wMin}–${wMax} wk`;
rows+=`<div class="gantt-row duration-row"><div class="gantt-label">${t(key)}</div><div class="gantt-track">
<div class="gantt-bar duration-only" style="left:0;width:${wPct}%" data-en="${d[3].replace(/"/g,"&quot;")}" data-zh="${d[4].replace(/"/g,"&quot;")}" data-dates="${range}"></div>
</div><div class="gantt-dates">${range}</div></div>`;
});
return `<div class="gantt-wrap"><div class="chart-title">${t("ganttSub")}</div>
<div class="gantt-axis">${t("axis").map(y=>`<span>${y}</span>`).join("")}</div>
<div class="gantt-body">${rows}</div>
<div class="gantt-legend"><span><i style="background:var(--teal)"></i>${t("legDone")}</span>
<span><i style="background:#1a4a6e"></i>${t("legPlan")}</span>

<span><i style="background:#6d5b95"></i>${t("legAssume")}</span></div></div>`;
}

function bindGanttTips(){
document.querySelectorAll(".gantt-bar").forEach(el=>{
el.addEventListener("mouseenter",e=>{
const tip=document.getElementById("tip");
tip.querySelector(".td").textContent=el.dataset.dates;
tip.querySelector(".tb").textContent=lang==="zh"?el.dataset.zh:el.dataset.en;
tip.classList.add("show");moveTip(e);});
el.addEventListener("mousemove",moveTip);
el.addEventListener("mouseleave",()=>document.getElementById("tip").classList.remove("show"));
});
}
function moveTip(e){const tip=document.getElementById("tip");
let x=e.clientX+12,y=e.clientY+12;
if(x+360>innerWidth)x=e.clientX-340;
if(y+80>innerHeight)y=e.clientY-70;
tip.style.left=x+"px";tip.style.top=y+"px";}
function applyLang(){
document.documentElement.lang=lang==="zh"?"zh-CN":"en";
const saved=idx;
document.getElementById("deck").innerHTML=deckHTML();
document.getElementById("footerText").textContent=t("footer");
document.getElementById("navHint").textContent=t("nav");
document.getElementById("btnZh").classList.toggle("active",lang==="zh");
document.getElementById("btnEn").classList.toggle("active",lang==="en");
chartsBuilt=false;bindGanttTips();show(saved);
}
function slides(){return document.querySelectorAll(".slide");}
function show(n){
const s=slides();idx=(n+s.length)%s.length;
s.forEach((el,i)=>el.classList.toggle("active",i===idx));
document.getElementById("counter").textContent=(idx+1)+" / "+s.length;
if(idx===4&&!chartsBuilt){buildHplcInvestmentCharts();chartsBuilt=true;}
}
document.getElementById("btnZh").onclick=()=>{if(lang!=="zh"){lang="zh";applyLang();}};
document.getElementById("btnEn").onclick=()=>{if(lang!=="en"){lang="en";applyLang();}};
document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();show(idx+1);}
if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(idx-1);}
});
applyLang();
</script>
