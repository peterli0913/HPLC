function extCostLabels(){return I18N[lang].extCost;}
function extBullets(id){const b=I18N[lang].extCost.bullets;return (b&&b[id])?b[id]:[];}
function extCostItemHTML(id,amt){
const L=extCostLabels();

const body=bl?`<div class="cost-children">${bl}</div>`:"";
return `<details class="cost-item cost-item-sub"${bl?"":" data-no-body"}><summary><span class="cost-label">${L[id]}</span><span class="cost-amt">${fm(amt)}</span></summary>${body}</details>`;
}

function hipoCostLabels(){return I18N[lang].hipoCost;}
function hipoLeaf(id,amt,depth){
const L=hipoCostLabels();
const pad=depth===3?" cost-leaf-l3":"";
return `<div class="cost-leaf cost-leaf-sub${pad}"><span>${L[id]}</span><span>${fm(Number(amt)||0)}</span></div>`;
}
function hipoSectionHd(title,total){
return `<span class="cost-section-title">${title}</span><span class="cost-section-amt">${fm(Number(total)||0)}</span>`;
}
function hipoSubHd(title,total){
return `<span class="cost-label">${title}</span><span class="cost-amt">${fm(Number(total)||0)}</span>`;
}
function hipoGroup(id,leaves){
const D=HIPO_COST_DATA,L=hipoCostLabels(),ln=D.lines||{};
const body=leaves.map(k=>hipoLeaf(k,ln[k],3)).join("");
return `<details class="cost-item cost-item-sub cost-item-l2" open><summary>${hipoSubHd(L[id],D.groups[id])}</summary>
<div class="cost-children">${body}</div></details>`;
}
function hipoGroupFlat(id){
const D=HIPO_COST_DATA,L=hipoCostLabels();
return `<details class="cost-item cost-item-sub cost-item-l2" data-no-body><summary>${hipoSubHd(L[id],D.groups[id])}</summary></details>`;
}

].join("");
const buildBlock=`<details class="cost-section" open><summary class="cost-section-hd">${hipoSectionHd(L.secBuild,D.buildingWorks)}</summary>

let EQUIP_MUST={};
let EQUIP_FILTER="all";
function equipIsNew(it){return it.ne!=="E";}
function equipMust(id){return EQUIP_MUST[id]!==false;}
function equipNeLabel(ne){
if(ne==="N")return t("hipoEqNew");
if(ne==="E")return t("hipoEqExist");
if(ne==="N/E")return "N/E";
return "—";
}
function equipNeClass(ne){return ne==="E"?"ne-E":(ne==="N"||ne==="N/E"?"ne-N":"");}
function equipNewMustTotal(){
return EQUIP_ITEMS.reduce((s,it)=>s+(equipIsNew(it)&&equipMust(it.id)?it.cost:0),0);
}
function renderEquipPage(){
const wrap=document.getElementById("equipTableWrap");
const totalEl=document.getElementById("equipTotalAmt");
if(!wrap)return;
const groups=[];
EQUIP_ITEMS.forEach(it=>{
if(EQUIP_FILTER==="new"&&!equipIsNew(it))return;
if(EQUIP_FILTER==="existing"&&equipIsNew(it))return;
const last=groups[groups.length-1];
if(!last||last.group!==it.group)groups.push({group:it.group,items:[it]});
else last.items.push(it);
});
let html=`<table class="equip-table"><thead><tr>
<th>${t("hipoEqColTitle")}</th><th>${t("hipoEqColLoc")}</th><th>${t("hipoEqColModel")}</th>
<th>${t("hipoEqColNE")}</th><th class="cost">${t("hipoEqColCost")}</th>
<th class="chk">${t("hipoEqColMust")}</th></tr></thead><tbody>`;
groups.forEach(g=>{
html+=`<tr class="grp"><td colspan="6">${g.group}</td></tr>`;
g.items.forEach(it=>{
const checked=equipMust(it.id)?" checked":"";
html+=`<tr data-id="${it.id}">
<td>${it.title}</td><td>${it.location||"—"}</td><td>${it.model||"—"}</td>
<td class="${equipNeClass(it.ne)}">${equipNeLabel(it.ne)}</td>
<td class="cost">${fm(it.cost)}</td>
<td class="chk"><input type="checkbox" data-equip="${it.id}"${checked}></td>
</tr>`;
});
});
html+="</tbody></table>";
wrap.innerHTML=html;
if(totalEl)totalEl.textContent=fm(equipNewMustTotal());
document.querySelectorAll(".equip-filters button").forEach(btn=>{
btn.classList.toggle("active",btn.dataset.filter===EQUIP_FILTER);
});
wrap.querySelectorAll("input[data-equip]").forEach(box=>{
box.addEventListener("change",()=>{
EQUIP_MUST[box.dataset.equip]=box.checked;
if(document.getElementById("equipTotalAmt"))
document.getElementById("equipTotalAmt").textContent=fm(equipNewMustTotal());
});
});
}
function bindEquipPage(){
document.querySelectorAll(".equip-filters button").forEach(btn=>{
btn.onclick=()=>{EQUIP_FILTER=btn.dataset.filter;renderEquipPage();};
});
renderEquipPage();
}

function t(k){return I18N[lang][k]||k;}
function fm(n){return "£"+Math.round(n).toLocaleString("en-GB");}

function ganttDateLabel(g){
if(g[6]&&String(g[6]).includes("–"))return g[6];
const dispStart=g[6]||g[1],dispEnd=g[7]||g[2];
const d0=dispStart.slice(0,7).replace("-","/"),d1=dispEnd.slice(0,7).replace("-","/");
return d0+" – "+d1;
}
function ganttHTML(data,T0,T1,keys,axis,today,sub,leg){
const RANGE=T1-T0;
function pct(d){return Math.max(0,Math.min(100,((new Date(d)-T0)/RANGE)*100));}
let rows="";
data.forEach((g,i)=>{
const key=keys[i]||g[0];
const left=pct(g[1]),right=pct(g[2]),w=Math.max(1.2,right-left);
const dateLabel=ganttDateLabel(g);
rows+=`<div class="gantt-row"><div class="gantt-label">${t(key)}</div><div class="gantt-track">
${i===0?`<div class="today-line" style="left:${pct(today)}%"><span class="today-tag">${t(leg.today||"today")}</span></div>`:""}
<div class="gantt-bar ${g[3]}" style="left:${left}%;width:${w}%" data-en="${g[4].replace(/"/g,"&quot;")}" data-zh="${g[5].replace(/"/g,"&quot;")}" data-dates="${dateLabel}"></div>
</div><div class="gantt-dates">${dateLabel}</div></div>`;
});
return `<div class="gantt-wrap"><div class="chart-title">${t(sub)}</div>
<div class="gantt-axis">${axis.map(y=>`<span>${y}</span>`).join("")}</div>
<div class="gantt-body">${rows}</div>
<div class="gantt-legend">
${leg.d?`<span><i style="background:var(--teal)"></i>${t(leg.d)}</span>`:""}
${leg.p?`<span><i style="background:#1a4a6e"></i>${t(leg.p)}</span>`:""}
${leg.b?`<span><i style="background:#2e6da4"></i>${t(leg.b)}</span>`:""}
${leg.w?`<span><i style="background:var(--accent)"></i>${t(leg.w)}</span>`:""}
${leg.c?`<span><i style="background:var(--accent)"></i>${t(leg.c)}</span>`:""}
${leg.s?`<span><i style="background:#5b6eae"></i>${t(leg.s)}</span>`:""}
${leg.a?`<span><i style="background:#6d5b95"></i>${t(leg.a)}</span>`:""}
</div></div>`;
}

function bindGanttTips(){
document.querySelectorAll(".gantt-bar").forEach(el=>{
el.addEventListener("mouseenter",e=>{
const tip=document.getElementById("tip");
tip.querySelector(".td").textContent=el.dataset.dates;
tip.querySelector(".tb").textContent=lang==="zh"?el.dataset.zh:el.dataset.en;
tip.classList.add("show");moveTip(e);});
el.addEventListener("mousemove",moveTip);
el.addEventListener("mouseleave",()=>document.getElementById("tip").classList.remove("show"));
});
}
function moveTip(e){const tip=document.getElementById("tip");
let x=e.clientX+12,y=e.clientY+12;
if(x+360>innerWidth)x=e.clientX-340;
if(y+80>innerHeight)y=e.clientY-70;
tip.style.left=x+"px";tip.style.top=y+"px";}

function buildCharts(which){
const zh=lang==="zh";
if(which==="ext"&&!chartsBuilt.ext){buildExtInvestmentCharts();chartsBuilt.ext=true;}
if(which==="hplc"&&!chartsBuilt.hplc){buildHplcInvestmentCharts();chartsBuilt.hplc=true;}
if(which==="c1"&&!chartsBuilt.c1){buildC1InvestmentCharts();chartsBuilt.c1=true;}
if(which==="hipo"&&!chartsBuilt.hipo){buildHipoInvestmentCharts();chartsBuilt.hipo=true;}
}

function applyLang(){
document.documentElement.lang=lang==="zh"?"zh-CN":"en";
const saved=idx;
chartsBuilt={};
document.getElementById("deck").innerHTML=deckHTML();
document.getElementById("footerText").textContent=t("footer");
document.getElementById("navHint").textContent=t("nav");
document.getElementById("btnZh").classList.toggle("active",lang==="zh");
document.getElementById("btnEn").classList.toggle("active",lang==="en");
bindGanttTips();
bindEquipPage();
show(saved);
}
function slides(){return document.querySelectorAll(".slide");}
function show(n){
const s=slides();idx=(n+s.length)%s.length;
s.forEach((el,i)=>el.classList.toggle("active",i===idx));
document.getElementById("counter").textContent=(idx+1)+" / "+s.length;
const ch=s[idx].dataset.charts;
if(ch)buildCharts(ch);
}
document.getElementById("btnZh").onclick=()=>{if(lang!=="zh"){lang="zh";applyLang();}};
document.getElementById("btnEn").onclick=()=>{if(lang!=="en"){lang="en";applyLang();}};
document.addEventListener("keydown",e=>{
const tag=(e.target&&e.target.tagName||"").toLowerCase();
if(tag==="input"||tag==="textarea"||tag==="button")return;
if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();show(idx+1);}
if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(idx-1);}
});
applyLang();
</script>
