function ganttHTML(data,T0,T1,keys,axis,today,sub,leg){
const RANGE=T1-T0;
function pct(d){return Math.max(0,Math.min(100,((new Date(d)-T0)/RANGE)*100));}
let rows="";
data.forEach((g,i)=>{
const key=keys[i]||g[0];
const left=pct(g[1]),right=pct(g[2]),w=Math.max(1.2,right-left);
const d0=g[1].slice(0,7).replace("-","/"),d1=g[2].slice(0,7).replace("-","/");
rows+=`<div class="gantt-row"><div class="gantt-label">${t(key)}</div><div class="gantt-track">
${i===0?`<div class="today-line" style="left:${pct(today)}%"><span class="today-tag">${t(leg.today||"today")}</span></div>`:""}
<div class="gantt-bar ${g[3]}" style="left:${left}%;width:${w}%" data-en="${g[4].replace(/"/g,"&quot;")}" data-zh="${g[5].replace(/"/g,"&quot;")}" data-dates="${d0} – ${d1}"></div>
</div><div class="gantt-dates">${d0} – ${d1}</div></div>`;
});
return `<div class="gantt-wrap"><div class="chart-title">${t(sub)}</div>
<div class="gantt-axis">${axis.map(y=>`<span>${y}</span>`).join("")}</div>
<div class="gantt-body">${rows}</div>
<div class="gantt-legend">
<span><i style="background:var(--teal)"></i>${t(leg.d)}</span>
<span><i style="background:#1a4a6e"></i>${t(leg.p)}</span>
<span><i style="background:#2e6da4"></i>${t(leg.b)}</span>
<span><i style="background:var(--accent)"></i>${t(leg.c)}</span>
${leg.s?`<span><i style="background:#5b6eae"></i>${t(leg.s)}</span>`:""}
${leg.a?`<span><i style="background:#6d5b95"></i>${t(leg.a)}</span>`:""}
</div></div>`;
}

function bindGanttTips(){
document.querySelectorAll(".gantt-bar").forEach(el=>{
el.addEventListener("mouseenter",e=>{
const tip=document.getElementById("tip");
tip.querySelector(".td").textContent=el.dataset.dates;
tip.querySelector(".tb").textContent=lang==="zh"?el.dataset.zh:el.dataset.en;
tip.classList.add("show");moveTip(e);});
el.addEventListener("mousemove",moveTip);
el.addEventListener("mouseleave",()=>document.getElementById("tip").classList.remove("show"));
});
}
function moveTip(e){const tip=document.getElementById("tip");
let x=e.clientX+12,y=e.clientY+12;
if(x+360>innerWidth)x=e.clientX-340;
if(y+80>innerHeight)y=e.clientY-70;
tip.style.left=x+"px";tip.style.top=y+"px";}

function buildCharts(which){
const zh=lang==="zh";
if(which==="port"&&!chartsBuilt.port){
new Chart(document.getElementById("cPort"),{type:"bar",data:{
labels:[zh?t("p2r1n"):"Extension",zh?t("p2r2n"):"Retrofit"],
datasets:[{label:zh?"OOM":"OOM",data:[EXT_OOM,HPLC_RISK.oom],backgroundColor:["#1a4a6e","#5b6eae"]}]
},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
tooltip:{callbacks:{label:c=>fm(c.raw)}}},scales:{y:{ticks:{callback:v=>"£"+(v/1e6).toFixed(1)+"M"}}}}});
chartsBuilt.port=true;
}
if(which==="ext"&&!chartsBuilt.ext){
new Chart(document.getElementById("cExt1"),{type:"bar",data:{labels:[zh?"项目总投资":"Total"],datasets:[
{label:zh?"基础建造":"Base",data:[EXT_BASE],backgroundColor:"#0f2b46"},
{label:zh?"其他":"Other",data:[4062357],backgroundColor:"#009688"},
{label:zh?"风险预备":"Risk",data:[EXT_RISK],backgroundColor:"#c9a227"}]},
options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},
scales:{x:{stacked:true,max:EXT_OOM*1.02,ticks:{callback:v=>"£"+(v/1e6).toFixed(1)+"M"}},y:{stacked:true,display:false}}}});
new Chart(document.getElementById("cExt2"),{type:"doughnut",data:{labels:[zh?"土建外围":"Civils",zh?"建筑机电":"M&E",zh?"工艺设备":"Process",zh?"临建":"Prelims",zh?"OH&P":"OH&P"],
datasets:[{data:[9186428,9532716,23249083,3357458,2266284],backgroundColor:["#1a4a6e","#2e6da4","#5a8ab8","#009688","#4db6ac"]}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{size:9}}}}}});
chartsBuilt.ext=true;
}
if(which==="hplc"&&!chartsBuilt.hplc){
const otherFj=CAPEX.F+CAPEX.G+CAPEX.H+CAPEX.I+CAPEX.J,oom=HPLC_RISK.oom;
new Chart(document.getElementById("cHplc1"),{type:"bar",data:{labels:[zh?"改造 OOM":"Retrofit OOM"],datasets:[
{label:zh?"直接工程":"Direct",data:[CAPEX.direct],backgroundColor:"#0f2b46"},
{label:zh?"其他":"Other",data:[otherFj],backgroundColor:"#009688"},
{label:zh?"风险预备":"Risk",data:[HPLC_RISK.cont_total],backgroundColor:"#c9a227"}]},
options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},
scales:{x:{stacked:true,max:oom*1.02,ticks:{callback:v=>"£"+(v/1e6).toFixed(2)+"M"}},y:{stacked:true,display:false}}}});
new Chart(document.getElementById("cHplc2"),{type:"bar",data:{labels:[zh?"直接工程":"Direct"],datasets:[
{label:"A",data:[CAPEX.A],backgroundColor:"#0f2b46"},
{label:"B",data:[CAPEX.B],backgroundColor:"#1a4a6e"},
{label:"C",data:[CAPEX.C],backgroundColor:"#2e6da4"},
{label:"D",data:[CAPEX.D],backgroundColor:"#4a7ba8"},
{label:"E",data:[CAPEX.E],backgroundColor:"#009688"}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},
scales:{x:{stacked:true,display:false},y:{stacked:true,ticks:{callback:v=>"£"+(v/1e6).toFixed(2)+"M"}}}}});
chartsBuilt.hplc=true;
}
}

function applyLang(){
document.documentElement.lang=lang==="zh"?"zh-CN":"en";
const saved=idx;
chartsBuilt={};
document.getElementById("deck").innerHTML=deckHTML();
document.getElementById("footerText").textContent=t("footer");
document.getElementById("navHint").textContent=t("nav");
document.getElementById("btnZh").classList.toggle("active",lang==="zh");
document.getElementById("btnEn").classList.toggle("active",lang==="en");
bindGanttTips();
show(saved);
}
function slides(){return document.querySelectorAll(".slide");}
function show(n){
const s=slides();idx=(n+s.length)%s.length;
s.forEach((el,i)=>el.classList.toggle("active",i===idx));
document.getElementById("counter").textContent=(idx+1)+" / "+s.length;
const ch=s[idx].dataset.charts;
if(ch)buildCharts(ch);
}
document.getElementById("btnZh").onclick=()=>{if(lang!=="zh"){lang="zh";applyLang();}};
document.getElementById("btnEn").onclick=()=>{if(lang!=="en"){lang="en";applyLang();}};
document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();show(idx+1);}
if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(idx-1);}
});
applyLang();
</script>
